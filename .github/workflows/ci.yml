name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      # The tests read the organisers' specimen registry, which is not
      # redistributed in this repository, so CI checks that every test
      # module imports and collects rather than running them.
      - name: Collect tests
        run: uv run pytest --collect-only -q
